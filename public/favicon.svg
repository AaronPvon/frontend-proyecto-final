<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fondo: cristal azul oscuro -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b" />
      <stop offset="1" stop-color="#0a1220" />
    </linearGradient>
    <!-- Brillo suave en la parte superior -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <!-- Moneda: de azul claro a azul intenso -->
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19b0d4" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
    <!-- Corte diagonal: deja ver el fondo a través de la moneda -->
    <mask id="cut">
      <rect width="200" height="200" fill="#fff" />
      <line x1="35" y1="165" x2="165" y2="35" stroke="#000" stroke-width="24" />
    </mask>
    <!-- Halo azul alrededor de la moneda -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <rect width="200" height="200" rx="45" fill="url(#bg)" />
  <circle cx="100" cy="100" r="65" fill="#19b0d4" opacity="0.45" filter="url(#glow)" mask="url(#cut)" />
  <circle cx="100" cy="100" r="65" fill="url(#coin)" mask="url(#cut)" />
  <!-- Línea fina naranja en el centro del corte -->
  <line x1="30" y1="170" x2="170" y2="30" stroke="#f5684a" stroke-width="8" />
  <rect width="200" height="200" rx="45" fill="url(#shine)" />
  <rect x="1.5" y="1.5" width="197" height="197" rx="43.5" fill="none" stroke="#19b0d4" stroke-opacity="0.4" stroke-width="3" />
</svg>
